services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_dev_password
      POSTGRES_DB: marketplace
    ports:
      - "5433:5432"
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data

volumes:
  marketplace_pgdata:
